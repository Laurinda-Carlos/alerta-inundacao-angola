<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nvula - Previsão de Inundações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f8f9fa;
    }
    .navbar {
      background-color: #007b8f !important;
    }
    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white !important;
      font-weight: 600;
    }
    .navbar-brand i {
      color: #aee0e6;
      font-size: 1.4rem;
    }
    .content-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 40px 20px;
    }
    .manual-section {
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      padding: 20px;
      flex: 1 1 100%;
      max-width: 700px;
      margin: 0 auto;
    }
    h4 {
      color: #007b8f;
      margin-bottom: 20px;
      text-align: center;
    }
    .btn-check-risk {
      background-color: #007b8f;
      color: white;
      font-weight: 600;
      width: 100%;
      margin-top: 10px;
    }
    footer {
      background-color: #007b8f;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <i class="bi bi-droplet-fill"></i> Nvula
      </a>
    </div>
  </nav>

  <!-- Formulário de previsão -->
  <div class="container content-wrapper">
    <div class="manual-section">
      <h4>Verificar Risco de Inundação</h4>
      <form id="manual-form" onsubmit="event.preventDefault(); checkRisk();">
        
        <!-- Provincia -->
        <div class="mb-3">
          <label class="form-label">Província</label>
          <select class="form-select" id="provincia" required>
            <option value="">Selecione...</option>
            <option value="Luanda">Luanda</option>
            <option value="Benguela">Benguela</option>
            <option value="Huíla">Huíla</option>
            <option value="Huambo">Huambo</option>
            <option value="Cunene">Cunene</option>
            <option value="Namibe">Namibe</option>
            <option value="Cuando Cubango">Cuando Cubango</option>
            <option value="Bié">Bié</option>
            <option value="Moxico">Moxico</option>
            <option value="Lunda Norte">Lunda Norte</option>
            <option value="Lunda Sul">Lunda Sul</option>
            <option value="Malanje">Malanje</option>
            <option value="Uíge">Uíge</option>
            <option value="Kwanza Norte">Kwanza Norte</option>
            <option value="Kwanza Sul">Kwanza Sul</option>
            <option value="Zaire">Zaire</option>
            <option value="Cabinda">Cabinda</option>
            <option value="Bengo">Bengo</option>
          </select>
        </div>

        <!-- Mês -->
        <div class="mb-3">
          <label class="form-label">Mês</label>
          <select class="form-select" id="mes" required>
            <option value="">Selecione...</option>
            <option value="1">Janeiro</option>
            <option value="2">Fevereiro</option>
            <option value="3">Março</option>
            <option value="4">Abril</option>
            <option value="5">Maio</option>
            <option value="6">Junho</option>
            <option value="7">Julho</option>
            <option value="8">Agosto</option>
            <option value="9">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>
        </div>

        <!-- Dados meteorológicos -->
        <div class="mb-3">
          <label class="form-label">Precipitação (mm)</label>
          <input type="number" class="form-control" id="precipitacao" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Temperatura (°C)</label>
          <input type="number" class="form-control" id="temperatura" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Humidade (%)</label>
          <input type="number" class="form-control" id="humidade" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Vento (km/h)</label>
          <input type="number" class="form-control" id="vento" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Radiação Solar (W/m²)</label>
          <input type="number" class="form-control" id="radiacao" required>
        </div>

        <button type="submit" class="btn btn-check-risk">Verificar Risco</button>
      </form>

      <!-- Resultado -->
      <div id="resultado" class="mt-4 text-center"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Nvula — Monitor de Inundações de Angola</p>
  </footer>

  <script>
    async function checkRisk() {
      const payload = {
        provincia: document.getElementById('provincia').value,
        mes: parseInt(document.getElementById('mes').value),
        precipitacao: parseFloat(document.getElementById('precipitacao').value),
        temperatura: parseFloat(document.getElementById('temperatura').value),
        humidade: parseFloat(document.getElementById('humidade').value),
        vento: parseFloat(document.getElementById('vento').value),
        radiacao_solar: parseFloat(document.getElementById('radiacao').value)
      };

      const res = await fetch("/api/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      const color =
        data.risco === "Alto" ? "text-danger" :
        data.risco === "Médio" ? "text-warning" : "text-success";

      document.getElementById("resultado").innerHTML = `
        <div class="alert alert-light shadow-sm border">
          <h5 class="${color}">Risco de Inundação: <strong>${data.risco}</strong></h5>
          <p>Probabilidade: ${(data.probabilidade_flood * 100).toFixed(1)}%</p>
        </div>
      `;
    }
  </script>

</body>
</html>
