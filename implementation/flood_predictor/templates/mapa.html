<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nvula - Mapa de Inundações</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
    }

    /* ===== Navbar ===== */
    .navbar {
      background-color: #007b8f !important;
    }

    .navbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white !important;
      font-weight: 600;
    }

    .navbar-brand i {
      color: #aee0e6;
      font-size: 1.4rem;
    }

    /* ===== Map Container ===== */
    #map {
      width: 100%;
      height: 90vh; /* ocupa quase toda a tela */
    }

    /* ===== Footer ===== */
    footer {
      background-color: #007b8f;
      color: white;
      text-align: center;
      padding: 15px 0;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <i class="bi bi-droplet-fill"></i> Nvula
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nvulaNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nvulaNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Mapa</a></li>
          <li class="nav-item"><a class="nav-link" href="/documentacao">Documentação</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== MAPA ===== -->
  <div id="map">
  {{ mapa_html|safe }}
</div>


  <!-- ===== FOOTER ===== -->
  <footer>
    <p>&copy; 2025 Nvula — Monitor de Inundações de Angola</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
